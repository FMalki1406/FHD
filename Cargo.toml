[workspace]
members = [
    "crates/download-core", "crates/resume-policy", "crates/transfer-store",
    "crates/download-engine", "crates/queue-secrets", "crates/platform-files",
    "crates/domain", "crates/application", "crates/config", "crates/telemetry",
    "crates/testkit",
