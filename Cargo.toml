[workspace]
members = [
    "crates/download-core", "crates/resume-policy", "crates/transfer-store",
    "crates/download-engine", "crates/queue-secrets", "crates/platform-files",
    "crates/domain", "crates/application", "crates/config", "crates/telemetry",
    "crates/testkit",
    "crates/runtime", "crates/adapters/storage", "crates/adapters/persistence",
    "crates/adapters/http",
    "crates/protocol", "crates/adapters/ipc", "crates/adapters/platform",
    "crates/bins/daemon",
]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
