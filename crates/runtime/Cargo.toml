[package]
name = "fhd-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fhd-app = { path = "../application" }
fhd-domain = { path = "../domain" }
fhd-telemetry = { path = "../telemetry" }
tokio = { version = "=1.51.4", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
fhd-testkit = { path = "../testkit" }
