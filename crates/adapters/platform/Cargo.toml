[package]
name = "fhd-platform"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "=1.51.4", features = ["net"] }

# `geteuid(2)` and nothing else.
#
# Already in Cargo.lock as a transitive dependency, so naming it here adds no
# code to the build. That does not make it exempt from review: direct and
# transitive dependencies are both in scope for the licence and security review
# this project requires, and arriving through another crate has never been a way
# round it.
#
# What is used and what is not: one function, `geteuid`, in `our_uid`. No
# allocation, no pointers, no file descriptors, nothing that can fail. If a
# second use appears it is a change to this comment and to the unsafe allowance
# in tools/check-architecture.mjs, both of which are reviewed.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    # `NtSetInformationFile` with `FILE_LINK_INFORMATION`: the only route on
    # Windows to create a link from an open handle rather than from a path.
    # `SetFileInformationByHandle` does not accept `FileLinkInfo`, so the
    # documented Win32 surface has none. Support: the function is documented on
    # learn.microsoft.com under the Windows Driver Kit, exported from ntdll.dll,
    # and callable from user mode; the class is FileLinkInformation (11). It is
    # not part of the Win32 API contract, which is the limit worth stating --
    # Microsoft may change it, and this project pins nothing about that.
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "=1.51.4", features = ["macros", "rt-multi-thread", "time"] }
