[package]
name = "fhd-platform"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "=1.51.4", features = ["net"] }

# `geteuid(2)`, `linkat(2)` on Linux, and `fclonefileat(2)`, `openat(2)` and
# `renameatx_np` on macOS.
#
# Already in Cargo.lock as a transitive dependency, so naming it here adds no
# code to the build. That does not make it exempt from review: direct and
# transitive dependencies are both in scope for the licence and security review
# this project requires, and arriving through another crate has never been a way
# round it.
#
# What is used, exactly:
#
#   * `geteuid` in `our_uid`. No arguments, no pointers, cannot fail.
#   * `linkat` with `AT_FDCWD` and `AT_SYMLINK_FOLLOW` in `link_into_directory`
#     on Linux: two borrowed descriptors, two NUL-terminated names owned by the
#     caller, a status back. It publishes, so it can fail, and every failure it
#     can return is mapped by the composition root.
#   * `fclonefileat` in `clone_into_directory` on macOS, which nothing calls --
#     it exists to be measured on the platform, and macOS still refuses to
#     publish.
#   * `openat` with `O_NOFOLLOW` in `open_in_directory`, and `renameatx_np` with
#     `RENAME_EXCL` in `move_into_directory`, both macOS and both also called by
#     nothing: they are the second and third steps of the candidate path -- pin
#     the clone, then move the pinned object into the adopted folder without
#     replacing. `renameatx_np` is Apple's, not POSIX; whether it satisfies the
#     publication contract is what the tests measure, not something this
#     manifest asserts.
#
# This comment said "one function, `geteuid`, and nothing else" while the crate
# had already grown the other two, and it is the comment that states the rule it
# broke: a second use is a change to this text and to the unsafe allowance in
# tools/check-architecture.mjs, both reviewed. The allowance was updated and this
# was not, so a dependency reviewer reading the manifest got a wrong answer.
# Found by an independent security review, which is later than it should have
# been caught.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    # `NtSetInformationFile` with `FILE_LINK_INFORMATION`: the only route on
    # Windows to create a link from an open handle rather than from a path.
    # `SetFileInformationByHandle` does not accept `FileLinkInfo`, so the
    # documented Win32 surface has none. Support: the function is documented on
    # learn.microsoft.com under the Windows Driver Kit, exported from ntdll.dll,
    # and callable from user mode; the class is FileLinkInformation (11). It is
    # not part of the Win32 API contract, which is the limit worth stating --
    # Microsoft may change it, and this project pins nothing about that.
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "=1.51.4", features = ["macros", "rt-multi-thread", "time"] }
