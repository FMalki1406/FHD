[package]
name = "fhd-platform"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "=1.51.4", features = ["net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "=1.51.4", features = ["macros", "rt-multi-thread", "time"] }
