[package]
name = "fhd-persistence"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fhd-app = { path = "../../application" }
fhd-domain = { path = "../../domain" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "=1.51.4", features = ["rt", "sync"] }
sha2 = "=0.11.0"

[dev-dependencies]
tokio = { version = "=1.51.4", features = ["macros", "rt-multi-thread", "sync"] }
