[package]
name = "fhd-daemon"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fhd-app = { path = "../../application" }
fhd-domain = { path = "../../domain" }
fhd-http = { path = "../../adapters/http" }
fhd-persistence = { path = "../../adapters/persistence" }
fhd-runtime = { path = "../../runtime" }
fhd-ipc = { path = "../../adapters/ipc" }
fhd-protocol = { path = "../../protocol" }
fhd-storage = { path = "../../adapters/storage" }
fhd-telemetry = { path = "../../telemetry" }
sha2 = "=0.11.0"
tokio = { version = "=1.51.4", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
# Measurements only: what a batched commit would cost against the same
# durability settings the repository uses.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
fhd-runtime = { path = "../../runtime" }
sha2 = "=0.11.0"
tokio = { version = "=1.51.4", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "fhd-engine"
path = "src/main.rs"
