name: Engine verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_extended:
        description: Run the optional bounded 64 MiB streaming workload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.13.1"
          package-manager-cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Record environment
        run: |
          rustc +1.98.1 --version --verbose
          cargo +1.98.1 --version
          node --version
      - name: Check formatting
        run: cargo +1.98.1 fmt --all -- --check
      # Both gates and both of their test suites. Running a gate without its own
      # tests is how an approved allowance once broke the build for everyone.
      - name: Enforce architecture boundaries
        run: |
          node tools/check-architecture.test.mjs
          node tools/check-architecture.mjs
          node tools/check-contract-tests.test.mjs
      - name: Check Rust warnings
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      # Split by area on purpose: a job's step names and their results are
      # readable without a token, but its logs are not. When something fails on a
      # runner we cannot reproduce, the failing step name is the whole diagnosis.
      - name: Test domain and application
        run: cargo +1.98.1 test -p fhd-domain -p fhd-app -p fhd-config -p fhd-telemetry --locked
      - name: Test protocol
        run: cargo +1.98.1 test -p fhd-protocol --locked
      # One step per test: a job's step names are readable without a token and its
      # logs are not, so on a runner we cannot reproduce this is the diagnosis.
      - name: Platform - the account and session are readable
        run: cargo +1.98.1 test -p fhd-platform --locked the_scope
      # Windows only, and marked so: a filter matching no test exits zero, which
      # would make these green no-ops elsewhere under security-sounding names.
      - name: Platform - the pipe carries the descriptor we asked for
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked descriptor_we_asked_for
      - name: Platform - a sandboxed process's descriptor is refused
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked sandboxed_process_could_make
      - name: Platform - a pipe is owned by the account that made it
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked owned_by_the_account
      - name: Platform - a pipe we made is one we will talk to
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked one_we_will_talk_to
      - name: Platform - an account is recognised under either spelling
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked either_spelling
      - name: Platform - a stranger who may write a directory is reported
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked stranger_may_write
      - name: Platform - a new directory is protected from what it inherits
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked until_it_is_protected
      - name: Platform - the ways the directory check used to fail open
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked used_to_fail_open
      # Not Windows-only: the owner rule is a pure decision, and running it
      # everywhere is what keeps it from drifting on a platform nobody checks.
      - name: Platform - the owner rule is decided, not assumed
        run: cargo +1.98.1 test -p fhd-platform --locked owner_rule_is_decided
      - name: Platform - the ways the swap check used to miss
        if: runner.os == 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked used_to_miss
      - name: Platform - a handle identifies its object after the name is taken
        if: runner.os == 'Windows'
        run: bash tools/one-test.sh fhd-platform tests::a_handle_identifies_its_object_after_the_name_is_taken
      - name: Platform - a link from a handle carries the held file
        if: runner.os == 'Windows'
        run: bash tools/one-test.sh fhd-platform tests::a_link_from_a_handle_carries_the_held_file_and_never_replaces
      # Each test above is named by a step, and a step that matched nothing would
      # pass in silence. This fails if the crate grows a test no step runs.
      - name: Platform - a stranger who may write a unix directory is reported
        if: runner.os != 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked stranger_may_write_a_unix
      - name: Platform - a directory we make is owner-only, one we find is untouched
        if: runner.os != 'Windows'
        run: cargo +1.98.1 test -p fhd-platform --locked owner_only_and_one_we_find
      # Linux only: setfacl sets POSIX default ACLs, which is the inheritance
      # Unix does have. macOS uses a different ACL system and is not covered.
      - name: Platform - a default ACL on the parent does not leave us open
        if: runner.os == 'Linux'
        run: cargo +1.98.1 test -p fhd-platform --locked default_acl_on_the_parent_grants_nobody
      # Linux only: publication there is `linkat` through the descriptor's entry
      # under `/proc/self/fd`, and a system without procfs has no route from a
      # descriptor to a new name. Each property is its own step so that which of
      # them holds is legible from the job's steps alone -- the logs need a
      # token, and a measurement nobody can read is not a measurement.
      #
      # Each filter is `--exact`. A substring filter reads whichever tests grow
      # to contain it: adding the moved-clone properties below made
      # `clone_refuses_an_occupied_name` match two tests, so a failure in the
      # new one would have reddened the step named for the old one. When the
      # step name is the whole measurement, it has to name one test.
      - name: Publication on Linux - the object is published, not the name
        if: runner.os == 'Linux'
        run: bash tools/one-test.sh fhd-platform a_source_name_taken_over_does_not_change_what_is_published
      - name: Publication on Linux - an occupied name is refused
        if: runner.os == 'Linux'
        run: bash tools/one-test.sh fhd-platform an_occupied_name_is_refused_and_the_file_there_is_untouched
      - name: Publication on Linux - a name that is not one component is refused
        if: runner.os == 'Linux'
        run: bash tools/one-test.sh fhd-platform a_name_that_is_not_one_component_is_refused
      - name: Publication on Linux - a swapped destination folder is not published into
        if: runner.os == 'Linux'
        run: bash tools/one-test.sh fhd-platform a_destination_folder_swapped_after_it_was_opened_is_not_the_one_published_into
      # The spelling the byte-level check exists for. `Path::components` reports
      # `x/.` as the single component `x`, and where `x` is a symlink to a
      # directory the kernel walks it. Both reviews found that the check guarding
      # this had no test on the platform where publication ships.
      - name: Publication on Linux - a trailing dot does not walk a symlinked directory
        if: runner.os == 'Linux'
        run: bash tools/one-test.sh fhd-platform a_symlinked_directory_is_not_walked_by_a_trailing_dot
      # macOS only, and a measurement rather than a mechanism: nothing in the
      # engine calls what these exercise. macOS refuses to publish, and these
      # answer -- on a real macOS rather than from a manual page read on a
      # Windows machine -- whether the one remaining candidate could carry it,
      # and what adopting it would cost. Each property is its own step for the
      # same reason the Linux ones are: the logs need a token.
      - name: Publication on macOS - a clone carries the handle's bytes
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_clone_carries_the_bytes_of_the_handle_not_of_its_name
      - name: Publication on macOS - a clone is a separate object
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_clone_is_a_separate_object_from_the_part_it_came_from
      - name: Publication on macOS - a clone refuses an occupied name
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_clone_refuses_an_occupied_name_and_leaves_it_untouched
      - name: Publication on macOS - a clone name must be one component
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_clone_name_that_is_not_one_component_is_refused
      # The three-step candidate: clone into a directory the engine owns, hold
      # the result open, then move *that object* into the adopted folder. The
      # reviews refused cloning straight into the destination because
      # `fclonefileat` hands back no descriptor for what it made, so the engine
      # would have to open the new name to learn what it published -- and the
      # name can be made to mean another file in between. These four measure
      # whether the move step closes that, or whether macOS has no safe route
      # and the support limit gets written down instead.
      - name: Publication on macOS - a moved clone keeps its identity
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_moved_clone_keeps_its_identity_and_lands_in_the_opened_folder
      - name: Publication on macOS - a moved clone refuses an occupied name
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_moved_clone_refuses_an_occupied_name_and_leaves_it_untouched
      - name: Publication on macOS - a moved clone ignores a swapped destination
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_moved_clone_ignores_a_directory_that_took_the_destination_name
      - name: Publication on macOS - a moved clone refuses names that are not one component
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_moved_clone_refuses_names_that_are_not_one_component
      # The step that decides against the candidate, and the four that constrain
      # the pin. Both reviews found step two had no test at all: every property
      # above passed with `O_NOFOLLOW` deleted and with the pin replaced by a
      # path-based open. The first of these measures the reason macOS cannot
      # adopt the path -- the move carries the staged *name*, not the pinned
      # object -- so it is expected to pass, and its passing is the evidence for
      # the support limit in section 11, not evidence that publication works.
      - name: Publication on macOS - a moved clone carries the name, not the pinned object
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_moved_clone_carries_the_staged_name_not_the_pinned_object
      - name: Publication on macOS - the pin refuses a symlink
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_pin_refuses_a_symlink_and_does_not_follow_it
      - name: Publication on macOS - the pin refuses a FIFO or a directory
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_pin_refuses_what_is_not_a_regular_file
      - name: Publication on macOS - the pin looks only inside the opened directory
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_pin_looks_only_inside_the_directory_that_was_opened
      - name: Publication on macOS - the pin refuses names that are not one component
        if: runner.os == 'macOS'
        run: bash tools/one-test.sh fhd-platform a_pin_refuses_names_that_are_not_one_component
      # It runs everywhere now. While it was Windows-only, a test compiled
      # under cfg(unix) could be added and run nowhere with nothing saying
      # so -- which is what happened to the Unix half of foreign_writers:
      # green on Linux and macOS, and no test on either touched it. `--list`
      # reports the tests this platform has, so each runner checks its own.
      - name: Platform - every test here is named by a step
        shell: bash
        run: |
          # Every test this platform compiled, wherever it lives. The old
          # pattern took only `tests::`-prefixed names, so one in another module,
          # at crate root, or under `tests/` was invisible: a review added such a
          # test and watched this step pass while nothing ran it.
          listed=$(cargo +1.98.1 test -p fhd-platform --locked --all-targets -- --list \
            | sed -n 's/: test$//p' | sed 's/^tests:://' | sort -u)
          # Read out of this file rather than hand-kept beside it. An engineering
          # review found the previous version kept two independent copies of the
          # same names -- the substring filters here and the `expected` list below
          # -- neither tied to the step that runs the test, so all three could
          # drift apart. These are the exact names the steps pass to
          # tools/one-test.sh, so they cannot disagree with the steps by
          # construction.
          named=$(grep -o 'one-test\.sh fhd-platform [A-Za-z0-9_:]*' .github/workflows/engine.yml \
            | sed 's/.* //' | sed 's/^tests:://' | sort -u)
          if [ -z "$named" ]; then
            echo "read no step names out of the workflow; this check would pass vacuously"; exit 1
          fi
          covered=$( { for filter in the_scope descriptor_we_asked_for \
              sandboxed_process_could_make owned_by_the_account one_we_will_talk_to \
              either_spelling stranger_may_write until_it_is_protected \
              used_to_fail_open owner_rule_is_decided used_to_miss \
              owner_only_and_one_we_find default_acl_on_the_parent; do
            printf '%s\n' "$listed" | grep -- "$filter" || true
          done; printf '%s\n' "$named"; } | grep -v '^$' | sort -u)
          # Only one direction is left to check here: a test this platform
          # compiles that no step names. The other direction -- a step naming a
          # test that does not exist, or one that is `#[ignore]`d -- used to be a
          # hand-kept list of expected names, a second copy that could drift from
          # the steps. tools/one-test.sh now refuses unless exactly one test ran
          # and passed, so a step whose name is wrong, or whose test this platform
          # does not compile, or which has been ignored, fails at that step and
          # says which. That is stricter than the list was and cannot drift.
          missing=$(comm -23 <(printf '%s\n' "$listed") <(printf '%s\n' "$covered"))
          if [ -n "$missing" ]; then
            echo "no step runs these tests:"; printf '%s\n' "$missing"; exit 1
          fi
      - name: Test IPC
        run: cargo +1.98.1 test -p fhd-ipc --locked
      - name: Test storage and persistence adapters
        run: cargo +1.98.1 test -p fhd-storage -p fhd-persistence --locked
      - name: Test HTTP adapter
        run: cargo +1.98.1 test -p fhd-http --locked
      - name: Test runtime
        run: cargo +1.98.1 test -p fhd-runtime --locked
      # Named separately, and NOT overlapping: every file under tests/ is an
      # auto-discovered target, so an unqualified `test -p fhd-daemon` would run
      # the process suite as well and it would cost its wall time twice.
      # One target per step, on purpose. Run together, a failure said only
      # "Test engine end to end" and three suites shared the blame: two rounds
      # of diagnosis were spent finding out which. Logs need a token, step
      # names do not, so the split is what makes a red run legible without one.
      # Every check is kept -- this changes where the boundary is drawn, not
      # what runs.
      - name: Test engine library
        run: cargo +1.98.1 test -p fhd-daemon --locked --lib
      # The test harness measuring itself. Its barrier decides which run a byte
      # count belongs to, and it has been wrong twice about the span it covers
      # -- silently, because the suites that rely on it cannot see it fail.
      - name: Test the measurement barrier
        run: cargo +1.98.1 test -p fhd-daemon --locked --test barrier
      - name: Test engine end to end
        run: cargo +1.98.1 test -p fhd-daemon --locked --test end_to_end
      - name: Test engine over its socket
        run: cargo +1.98.1 test -p fhd-daemon --locked --test resident
      # The library suites never start the program. Argument parsing, the
      # one-shot/serve/client dispatch and the control surface between two real
      # processes are only covered here.
      # The publication contract, on the wired path. Named on its own because
      # the storage adapter cannot reach the platform mechanism, so this is the
      # only place it is measured.
      # Not `cargo test` directly. That step went green with **zero tests** on
      # ubuntu once, and it also goes green when a test is `#[ignore]`d or a cfg
      # stops compiling one. The counting was then a one-off log read: somebody
      # counted ten tests once and nothing kept counting. This runs the same
      # tests and fails unless every property required on this platform ran and
      # passed, with none ignored. Verified by mutation: an `#[ignore]`, a
      # narrowed cfg, the whole file cfg'd off, and a test missing from the
      # specification all fail it.
      - name: Test the publication contract
        run: node tools/check-contract-tests.mjs
      - name: Test the engine as a program
        run: cargo +1.98.1 test -p fhd-daemon --locked --test process
      - name: Test legacy engine and stores
        run: cargo +1.98.1 test -p download-engine -p download-core -p resume-policy -p transfer-store -p queue-secrets -p platform-files -p fhd-testkit --locked
      - name: Build developer transfer tool
        run: cargo +1.98.1 build --bin fhd-transfer --locked
      - name: Test HTTP fixtures
        run: node tools/http-lab/server.test.mjs
      - name: Test real transfer executable
        run: node tools/http-lab/engine.test.mjs
      - name: Test TLS certificate rejection on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: node tools/http-lab/tls.test.mjs
      - name: Run optional streaming workload
        if: github.event_name == 'workflow_dispatch' && inputs.run_extended
        run: cargo +1.98.1 test -p download-engine --test unknown_length bounded_64_mib_chunked_workload --locked -- --ignored --exact
